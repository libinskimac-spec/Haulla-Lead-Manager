name: Generate Haulla Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'leads.csv'
      - 'main.py'
      - 'requirements.txt'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Generate Excel
        run: python main.py

      - name: Save Excel file
        uses: actions/upload-artifact@v4
        with:
          name: Haulla-Excel
          path: Haulla_Leads.xlsx
